<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTU Courses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        html {
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #e4e4e7;
            min-height: 100vh;
            padding: 2rem;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .courses {
                grid-template-columns: 1fr;
            }
        }

        .course {
            background: #18181b;
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .course:hover {
            border-color: #3f3f46;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .course-info {
            flex: 1;
        }

        .course-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fafafa;
            margin-bottom: 0.25rem;
        }

        .course-meta {
            font-size: 0.85rem;
            color: #71717a;
        }

        .ects {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            border-radius: 4px;
            font-weight: 500;
        }

        .syllabus-link {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s;
        }

        .syllabus-link:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #93c5fd;
        }

        .grade {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pct-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.45rem;
            border-radius: 4px;
            font-weight: 600;
            opacity: 0.9;
        }

        .assessments {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .assessment {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            padding: 0.35rem 0.6rem;
            background: #27272a;
            border-radius: 6px;
        }

        .assessment-name {
            color: #a1a1aa;
        }

        .assessment-score {
            color: #4ade80;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .assessment-score.empty {
            color: #52525b;
        }

        .materials-section {
            border-top: 1px solid #27272a;
            padding-top: 0.75rem;
        }

        .materials-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #71717a;
            cursor: pointer;
            user-select: none;
        }

        .materials-toggle:hover {
            color: #a1a1aa;
        }

        .materials-toggle .arrow {
            transition: transform 0.2s;
        }

        .materials-section.expanded .materials-toggle .arrow {
            transform: rotate(90deg);
        }

        .materials {
            display: none;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.75rem;
        }

        .materials-section.expanded .materials {
            display: flex;
        }

        .material {
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.15s;
            display: block;
        }

        .material:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }

        .material::before {
            content: "↓ ";
            opacity: 0.5;
        }

        .summary {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #18181b 0%, #1f1f23 100%);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #27272a;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .summary-item {
            text-align: center;
        }

        .summary-label {
            font-size: 0.75rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .summary-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .summary-sub {
            font-size: 0.8rem;
            color: #71717a;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="courses">
        {{COURSES}}
        {{SUMMARY}}
    </div>
    <script>
        document.querySelectorAll('.materials-toggle').forEach(toggle => {
            toggle.addEventListener('click', () => {
                toggle.closest('.materials-section').classList.toggle('expanded');
            });
        });
    </script>
</body>

</html>
